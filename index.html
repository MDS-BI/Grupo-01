<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ERP Base Module</title>
  </head>
  <body>
    <main id="app">
      <div id="config-errors" class="config-error" role="alert" hidden></div>

      <section id="view-welcome" aria-labelledby="welcome-heading">
        <h1 id="welcome-heading">ERP Base Module</h1>
        <p class="muted">Manage your master data or find a record.</p>
        <div class="welcome-actions">
          <button id="welcome-manage" type="button">Manage Entities &amp; Documents</button>
          <button id="welcome-search" type="button">Search Entities</button>
        </div>
      </section>

      <section id="view-manage" aria-labelledby="manage-heading" hidden>
        <h1 id="manage-heading">Manage Entities &amp; Documents</h1>

        <nav class="nav-tabs" aria-label="Manage navigation">
          <button id="tab-entities" type="button" class="tab-button active" aria-selected="true">Entities</button>
          <button id="tab-documents" type="button" class="tab-button" aria-selected="false">Documents</button>
          <button id="tab-home" type="button" class="tab-button">Home</button>
        </nav>

        <div id="panel-entities" role="tabpanel" aria-labelledby="tab-entities">
        <section aria-labelledby="entity-form-heading">
          <h2 id="entity-form-heading">Add / Edit Entity</h2>
          <form id="entity-form">
            <input type="hidden" id="entity-id" />
            <div>
              <label for="name">Name *</label>
              <input id="name" name="name" required />
              <div class="error" id="error-name" aria-live="polite"></div>
            </div>
            <div>
              <label for="code">Code *</label>
              <input id="code" name="code" required />
              <div class="error" id="error-code" aria-live="polite"></div>
            </div>
            <div>
              <label for="category">Category</label>
              <input id="category" name="category" />
            </div>
            <div>
              <label for="description">Description</label>
              <textarea id="description" name="description"></textarea>
            </div>
            <div>
              <label for="targetDate">Target date</label>
              <input id="targetDate" name="targetDate" type="date" />
              <div class="error" id="error-targetDate" aria-live="polite"></div>
            </div>
            <div id="entity-custom-fields"></div>
            <button type="submit" id="submit-button">Save</button>
            <button type="button" id="cancel-edit" hidden>Cancel Edit</button>
          </form>
        </section>

        <section aria-labelledby="edit-entity-heading">
          <h2 id="edit-entity-heading">Edit or remove an entity</h2>
          <div>
            <label for="edit-entity">Select an entity</label>
            <select id="edit-entity"></select>
            <div class="error" id="error-edit-entity" aria-live="polite"></div>
          </div>
          <button type="button" id="delete-entity">Delete selected entity</button>
        </section>
        </div>

        <div id="panel-documents" role="tabpanel" aria-labelledby="tab-documents" hidden>
        <section aria-labelledby="document-form-heading">
          <h2 id="document-form-heading">Add / Edit Document</h2>
          <form id="document-form">
            <input type="hidden" id="document-id" />
            <input type="hidden" id="document-entity-id" />
            <div>
              <label for="document-entity">Entity *</label>
              <select id="document-entity" name="document-entity"></select>
              <div class="error" id="error-document-entity" aria-live="polite"></div>
            </div>
            <div>
              <label for="reference">Reference *</label>
              <input id="reference" name="reference" required />
              <div class="error" id="error-reference" aria-live="polite"></div>
            </div>
            <div>
              <label for="startDate">Start date *</label>
              <input id="startDate" name="startDate" type="date" required />
              <div class="error" id="error-startDate" aria-live="polite"></div>
            </div>
            <div>
              <label for="endDate">End date *</label>
              <input id="endDate" name="endDate" type="date" required />
              <div class="error" id="error-endDate" aria-live="polite"></div>
            </div>
            <div>
              <label for="quantity">Quantity</label>
              <input id="quantity" name="quantity" type="number" min="1" step="1" />
              <div class="error" id="error-quantity" aria-live="polite"></div>
            </div>
            <div>
              <label for="totalAmount">Total amount</label>
              <input id="totalAmount" name="totalAmount" type="number" min="0" step="0.01" />
              <div class="error" id="error-totalAmount" aria-live="polite"></div>
            </div>
            <div>
              <label for="currency">Currency</label>
              <input id="currency" name="currency" placeholder="e.g. USD" />
            </div>
            <div id="document-status-control"></div>
            <div id="document-custom-fields"></div>
            <button type="submit" id="document-submit-button">Save Document</button>
            <button type="button" id="document-cancel-edit" hidden>Cancel Edit</button>
          </form>
        </section>

        <section aria-labelledby="edit-document-heading">
          <h2 id="edit-document-heading">Edit or remove a document</h2>
          <div>
            <label for="edit-document">Select a document</label>
            <select id="edit-document"></select>
            <div class="error" id="error-edit-document" aria-live="polite"></div>
          </div>
          <button type="button" id="delete-document">Delete selected document</button>
        </section>
        </div>
      </section>

      <section id="view-search" aria-labelledby="search-view-heading" hidden>
        <nav class="view-nav">
          <button id="back-from-search" type="button">&larr; Home</button>
          <h1 id="search-view-heading">Search Entities</h1>
        </nav>

        <section aria-labelledby="search-heading">
          <h2 id="search-heading">Find an entity</h2>
          <input id="search-input" name="search-input" placeholder="Search by name, code, category..." aria-label="Search entities" />
        </section>

        <section aria-labelledby="results-heading">
          <h2 id="results-heading">Results</h2>
          <div id="search-empty" class="empty" hidden>No entities match your search.</div>
          <ul id="search-results-list" aria-live="polite"></ul>
        </section>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
